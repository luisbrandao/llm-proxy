# LLM Proxy configuration.
# Copy to config.yaml and fill in. Provider API keys go inline below; they may
# optionally be pulled from the environment via ${ENV_VAR} interpolation instead.
#
# Runtime flags (LOG_INPUT, LOG_OUTPUT, PORT) and the proxy auth keys
# (PROXY_API_KEYS) are NOT here — set them as environment variables in
# docker-compose.yml / .env.
#
# ── Canonical namespace ─────────────────────────────────────────────────────
# Clients only ever see and send CANONICAL names. Native (provider-specific) ids
# never leak out. Two layers produce canonical names:
#   - providers.model_map  : per-provider native<->canonical dictionary.
#   - models:              : cross-provider routing table in canonical space.
# They compose — a logical model picks the providers + order; each provider's
# model_map supplies the native id. Nothing is named twice.

# Global aliases: simple name -> "provider:canonical" target. The model part is a
# canonical name (reverse-mapped to the provider's native id on the wire).
# Clients can request `model: "chat"` and it resolves to deepseek:deepseek-v4-pro.
# Aliases are also listed in /models so they're discoverable.
aliases:
  chat: deepseek:deepseek-v4-pro
  reasoner: deepseek:deepseek-v4-flash

# Proxy auth keys gate any backend marked `require_permission: true`. Set them
# via the PROXY_API_KEYS env var (comma-separated for several). Clients pass one
# as `Authorization: Bearer <key>`. A caller with a valid key sees and uses
# everything; a caller without one only sees/uses the open backends. With no
# keys configured the gate is inert (everything open).

# Each backend has:
#   slots             max concurrent in-flight requests (shared across all its
#                     models; omit = unlimited).
#   priority          lower = preferred when a model is served by several
#                     backends; defaults to config order. Ties round-robin
#                     across the tied backends that currently have a free slot.
#   require_permission  (default false) puts the backend behind the auth gate.
#   enabled_models    allow-list in NATIVE ids; empty = expose all (live-discovered).
#   model_map         native id -> clean canonical name. Drives /models display
#                     (native->canonical) and request rewrite (canonical->native).
#                     Must be a bijection per provider.
providers:
  - name: deepseek
    api_key: "sk-your-deepseek-key"   # or "${DEEPSEEK_API_KEY}" to read from env
    require_permission: true   # paid backend -> only authenticated callers
    base_url: "https://api.deepseek.com"
    enabled_models: [deepseek-chat, deepseek-reasoner]   # native ids
    slots: 10
    cache_ttl: 3600
    model_map:                 # native -> canonical
      deepseek-chat: deepseek-v4-pro
      deepseek-reasoner: deepseek-v4-flash
    # DeepSeek reports cache hits but no price, so price it from a list. USD per
    # 1M tokens by NATIVE id; used only when a response carries no usage.cost.
    pricing:
      models:
        deepseek-reasoner: {input: 0.15, cached: 0.003, output: 0.60}
        deepseek-chat: {input: 0.66, cached: 0.022, output: 1.98}
      peak:                    # weekday UTC windows billed at 2x
        multiplier: 2
        weekdays: [mon, tue, wed, thu, fri]
        utc_hours: ["01-04", "06-10"]

  - name: ollama
    api_key: ""
    base_url: "http://localhost:11434"   # Ollama serves plain HTTP
    enabled_models: []        # empty = expose all models (live-discovered)
    slots: 1                  # single GPU box
    priority: 1               # faster -> preferred for models it shares with gw
    cache_ttl: 10

  - name: ollamaGW
    api_key: ""
    base_url: "http://other_machine:11434"        # Ollama serves plain HTTP
    enabled_models: []        # empty = expose all models (live-discovered)
    slots: 1
    priority: 2               # slower -> only used when the faster box is busy
    cache_ttl: 10

  - name: openRouter
    # The vendor (openrouter / nanogpt / deepseek) is detected from base_url, so the
    # proxy reads this backend's published rates and balance on its own. Add
    # `vendor: openrouter` only for a backend reached through a host it does not know.
    api_key: "sk-your-openrouter-key"   # or "${OPENROUTER_API_KEY}" to read from env
    require_permission: true   # paid backend -> only authenticated callers
    base_url: "https://openrouter.ai/api"
    # OpenRouter has too many models — pick the native ids to expose upstream.
    enabled_models:
      - anthropic/claude-3.5-sonnet
      - openai/gpt-4o
    model_map:                 # native -> canonical (clean names clients see)
      anthropic/claude-3.5-sonnet: sonnet
      openai/gpt-4o: gpt-4o
    # Optional: pin which upstream OpenRouter routes a model to, otherwise it
    # picks the cheapest/available one (which may not be who you want). Keyed by
    # resolved NATIVE model id. A list pins strictly (order + allow_fallbacks=false);
    # a dict is forwarded verbatim as OpenRouter's `provider` field. Clients that
    # send their own `provider` field override this.
    provider_routing:
      anthropic/claude-3.5-sonnet: [anthropic]
      # full control form:
      # openai/gpt-4o: { order: [openai], allow_fallbacks: true }
    # Extra headers sent upstream (defaults — a header the client already sent
    # wins). OpenRouter attributes the calling app by HTTP-Referer + X-Title;
    # clients pointed at a generic OpenAI endpoint don't send these, so set them
    # here to claim your app on OpenRouter's dashboard.
    headers:
      HTTP-Referer: "https://github.com/luisbrandao/llm-proxy"
      X-Title: "llm-proxy"
    slots: 10
    cache_ttl: 3600

  # Google Gemini via its OpenAI-compatible endpoint (NOT the native
  # generateContent API). Standard Bearer auth + `messages` body; the only quirk
  # is the path root is /v1beta/openai, handled by strip_path_prefix.
  - name: google
    api_key: "${GEMINI_API_KEY}"
    require_permission: true
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    strip_path_prefix: "v1"     # /v1/chat/completions -> /v1beta/openai/chat/completions
    strip_fields: [num_ctx]     # Google 400s on unknown fields some clients inject
    enabled_models: []          # [] = live-discover; or list e.g. [gemini-flash-latest]
    slots: 10
    cache_ttl: 3600

  # Claude through the official Claude Code CLI, run headless in the proxy's
  # container — draws from the Claude subscription the CLI is logged in as, not
  # an API key. No base_url / api_key; log the CLI in once with
  #   docker exec -it llm-proxy claude auth login --claudeai
  # Text chat completions with emulated function calling (streams arrive as one
  # chunk). Keep it behind the key — the subscription is personal — and slots
  # low: each request is a process.
  - name: claude
    kind: claude-cli
    require_permission: true
    slots: 1
    enabled_models: []          # [] = the CLI's aliases: fable, opus, sonnet, haiku
    model_map:                  # native (CLI alias) -> canonical
      fable: claude-fable
      opus: claude-opus
      sonnet: claude-sonnet
      haiku: claude-haiku

# Logical models: one canonical name backed by several prioritized targets — the
# cross-provider routing/failover/load-balance table.
#   - Omit a target's `model:` and the native id is inherited from that provider's
#     model_map (the canonical name reverse-mapped).
#   - Set `model:` explicitly to pin a specific native id — e.g. an Ollama model
#     served as a different quant on each box.
# Backends that expose the *same* canonical id auto-group with no entry here,
# ordered by provider priority. Explicit `provider:model` always still pins one.
# Keep targets in this one-line flow style — the web console's runtime priority
# editor persists changes by rewriting exactly these lines (config mount must be rw).
models:
  deepseek-v4-flash:
    targets:                    # native ids inherited via each provider's model_map
      - {provider: openRouter, priority: 1}
      - {provider: deepseek,   priority: 2}
  glm-4.7-flash:
    targets:                    # per-quant: native differs per box -> set model:
      - {provider: ollama,   model: "glm-4.7-flash:Q8_0",   priority: 1}
      - {provider: ollamaGW, model: "glm-4.7-flash:Q4_K_M", priority: 2}

# Global routing behavior.
routing:
  queue_timeout: 0     # seconds to wait for a free slot; 0 = wait indefinitely
  failover: true       # on backend error, retry the next-priority target
  auto_group: true     # identical canonical names across backends load-balance
  down_backoff: 15     # seconds a failed backend is skipped before retrying
  # When a slot frees, prefer a queued request whose model the backend already has
  # loaded over strict FIFO — a local backend that swaps models pays seconds per
  # swap, and FIFO happily swaps a model out that the next request needs back.
  queue_affinity: true
  # Times affinity may pass over a waiting request before it is admitted anyway.
  # Bounds the unfairness; 0 means strict FIFO.
  affinity_max_skips: 3
  # Upstream HTTP statuses that count as a "backend error" and trigger failover
  # to the next target (a connection failure always does). 4xx like 400/404 are
  # relayed as-is — every backend would reject them the same way. Default below.
  failover_statuses: [429, 500, 502, 503, 504]
  # Smart routing: try a model's backends cheapest-first, ranked by what the cost
  # ledger has seen each one charge per million tokens (see README "Smart routing").
  # OFF by default — the priority order above runs unless this is true. Switchable
  # from the console's Routing tab, which writes it back here.
  smart_routing: false
  smart_window_days: 7      # how far back the observed prices are read
  smart_min_requests: 5     # priced requests a (model, backend) needs before it is ranked
  # Per-backend override. auto (default) takes part in the ranking; fixed is never
  # moved by it; first / last put a backend ahead of / behind the rest of its
  # model's backends — "use X because I said so" — with smart routing on or off.
  # A claude-cli backend is always fixed. Only non-default entries need listing.
  # backend_modes:
  #   google: fixed
  #   nanoGPT: first

# Context guardrail (see README "Context guardrail"). Acts only on a chat body
# that carries an integer `num_ctx` (Open WebUI sends the model's configured
# context size) AND is estimated to exceed `num_ctx - response_headroom`. Then,
# in order: old oversized tool results are cut to a head+tail excerpt; the
# oldest turns are dropped (system messages always kept, a tool call and its
# results go together); the newest turn is always sent. A request that fits is
# forwarded untouched. Every trim logs a WARNING and counts in
# llm_proxy_trims_total{model}.
trim:
  enabled: true
  # The tokenizer.json tokens are counted with. The image bakes Qwen's in here
  # (every local model is Qwen3.5+); a relative path is taken from this file's
  # directory. "" — or a file that will not load — falls back to chars_per_token.
  tokenizer: /app/tokenizers/qwen3.8.json
  # The fallback estimate = serialized JSON chars / chars_per_token. 3 over-counts
  # source code but under-counts digit-heavy output; it is only the fallback.
  chars_per_token: 3.0
  response_headroom: 4000       # tokens kept free below num_ctx for the reply
  max_tool_result_tokens: 4000  # tool results above this (and old) are excerpted; 0 = never
  protect_recent: 10            # the newest N messages are never excerpted
