name: Docker Build

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Action versions are the current majors that run on Node 24. GitHub annotates
# every run that still uses a Node 20 action, so bump these together when the
# next runtime deprecation lands.
jobs:
  # Gates the build below. The suite needs no network and runs in under a second,
  # so there is no reason to publish an image that fails it.
  test:
    # Pinned, not `ubuntu-latest`: that label moves to Ubuntu 26 on 2026-10-19,
    # and a runner image change should be a deliberate edit here, not a
    # surprise in a build log. This is what `latest` resolved to when pinned.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'   # match the Dockerfile
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Import check against the example config
        run: CONFIG_PATH=config.example.yaml python -c "from app import main; print('imports OK')"

  build:
    needs: test
    runs-on: ubuntu-24.04   # see the test job
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=master-${{ github.run_number }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the build identity into the image so the running process can
          # report it (app/version.py -> /health, /metrics, the console header).
          # APP_VERSION must stay byte-identical to the `master-N` tag produced
          # by the metadata step above, so "what the compose file pins" and
          # "what is actually answering requests" are directly comparable.
          build-args: |
            APP_VERSION=master-${{ github.run_number }}
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
